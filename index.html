<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B0D12" />
<title>Voice Changer Pro</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
  :root{
    --bg:#0B0D12;
    --surface:#14171F;
    --surface-2:#1B1F2A;
    --violet:#7C5CFF;
    --mint:#23E5C9;
    --text:#EDEFF5;
    --muted:#8A8FA3;
    --danger:#FF5C7A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:radial-gradient(120% 100% at 50% -10%, #1B1024 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 8px;
  }
  .brand{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:19px; letter-spacing:-0.02em;
    display:flex; align-items:center; gap:8px;
  }
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px var(--mint);}
  select#langSelect{
    background:var(--surface); color:var(--text); border:1px solid #262B38;
    border-radius:10px; padding:7px 10px; font-size:13px; font-family:'Inter',sans-serif;
  }

  .stage{ display:flex; flex-direction:column; align-items:center; padding:6px 20px 10px; }
  .orb-wrap{ position:relative; width:220px; height:220px; margin:14px 0 6px; }
  canvas#orb{ width:100%; height:100%; display:block; }
  .status{
    font-size:13px; color:var(--muted); margin-top:4px; text-align:center; min-height:18px;
  }
  .presetName{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px;
    margin-top:2px; letter-spacing:-0.01em;
  }

  .micBtn{
    width:78px; height:78px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(145deg,var(--violet),#5A3CE0);
    box-shadow:0 8px 30px rgba(124,92,255,0.45);
    display:flex; align-items:center; justify-content:center;
    margin:14px 0 4px; transition:transform .15s ease, box-shadow .15s ease;
  }
  .micBtn:active{ transform:scale(0.94); }
  .micBtn.recording{
    background:linear-gradient(145deg,var(--danger),#C93A57);
    box-shadow:0 8px 30px rgba(255,92,122,0.5);
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,92,122,0.55);}
    70%{box-shadow:0 0 0 22px rgba(255,92,122,0);}
    100%{box-shadow:0 0 0 0 rgba(255,92,122,0);}
  }
  .micBtn svg{width:30px;height:30px;fill:#fff;}
  .hint{font-size:12px; color:var(--muted); margin-bottom:6px;}

  .section-label{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px;
    text-transform:uppercase; letter-spacing:0.08em; color:var(--muted);
    padding:18px 20px 8px;
  }

  .presetScroll{
    display:flex; gap:10px; overflow-x:auto; padding:2px 20px 6px;
    scrollbar-width:none;
  }
  .presetScroll::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:6px;
    background:var(--surface); border:1px solid #21252F; border-radius:16px;
    padding:12px 14px; min-width:78px; cursor:pointer; transition:border-color .15s, transform .1s;
  }
  .chip:active{ transform:scale(0.96); }
  .chip.active{ border-color:var(--mint); box-shadow:0 0 0 1px var(--mint) inset, 0 0 20px rgba(35,229,201,0.15); }
  .chip .emoji{font-size:22px;}
  .chip .label{font-size:11px; color:var(--muted); text-align:center; line-height:1.2;}
  .chip.active .label{color:var(--text);}

  .controls{
    background:var(--surface); margin:14px 20px; border-radius:18px;
    padding:16px 18px 18px; border:1px solid #21252F;
  }
  .controls summary{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px;
    cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center;
  }
  .controls summary::-webkit-details-marker{display:none;}
  .controls summary .chev{color:var(--muted); font-size:12px;}
  .row{margin-top:16px;}
  .row label{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:6px;}
  .row label span.val{color:var(--mint); font-family:'Space Grotesk',sans-serif;}
  input[type=range]{
    width:100%; -webkit-appearance:none; height:4px; border-radius:2px;
    background:#2A2F3C; outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
    background:var(--violet); box-shadow:0 0 8px rgba(124,92,255,0.6); cursor:pointer;
  }

  .save{
    display:flex; justify-content:center; padding:6px 20px 28px;
  }
  .save button{
    background:transparent; border:1px solid #2A2F3C; color:var(--muted);
    padding:10px 18px; border-radius:12px; font-size:13px; font-family:'Inter',sans-serif;
    display:flex; align-items:center; gap:8px; cursor:pointer;
  }
  .save button:disabled{opacity:0.4;}

  .installBanner{
    display:none; margin:0 20px 16px; background:var(--surface-2); border:1px solid #262B38;
    border-radius:14px; padding:12px 14px; font-size:12.5px; color:var(--muted);
    align-items:center; justify-content:space-between; gap:10px;
  }
  .installBanner button{
    background:var(--violet); color:#fff; border:none; border-radius:9px; padding:8px 12px;
    font-size:12.5px; font-weight:600; flex:0 0 auto;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span> Voice Changer Pro</div>
  <select id="langSelect"></select>
</div>

<div class="installBanner" id="installBanner">
  <span id="installText">Install this as an app on your home screen</span>
  <button id="installBtn">Install</button>
</div>

<div class="stage">
  <div class="orb-wrap"><canvas id="orb" width="220" height="220"></canvas></div>
  <div class="presetName" id="presetName">Normal</div>
  <div class="status" id="statusText">Tap the mic to start</div>

  <button class="micBtn" id="micBtn" aria-label="Toggle microphone">
    <svg viewBox="0 0 24 24" id="micIcon"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
  </button>
  <div class="hint" id="hintText">Live — nothing is recorded or saved</div>
</div>

<div class="section-label" id="voicesLabel">Voices</div>
<div class="presetScroll" id="presetScroll"></div>

<details class="controls">
  <summary id="advancedLabel">Advanced <span class="chev">▾</span></summary>
  <div class="row">
    <label id="pitchLabel">Pitch <span class="val" id="pitchVal">0</span></label>
    <input type="range" id="pitchSlider" min="-12" max="12" step="1" value="0" />
  </div>
  <div class="row">
    <label id="formantLabel">Formant / Tone <span class="val" id="formantVal">0</span></label>
    <input type="range" id="formantSlider" min="-100" max="100" step="5" value="0" />
  </div>
  <div class="row">
    <label id="speedLabel">Speed <span class="val" id="speedVal">1.0x</span></label>
    <input type="range" id="speedSlider" min="0.5" max="2" step="0.05" value="1" />
  </div>
</details>

<div class="save">
  <button id="saveBtn" disabled>⬇ <span id="saveLabel">Save last take</span></button>
</div>

  var el = document.getElementById("statusText");
  if(el) el.textContent = "Script error: " + e.message;
});

const translations = {

      install:"হোম স্ক্রিনে অ্যাপ হিসেবে ইনস্টল করুন", installBtn:"ইনস্টল", save:"শেষ টেক সংরক্ষণ করুন", noMic:"মাইক্রোফোন অ্যাক্সেস প্রত্যাখ্যাত"},
  pa:{brand:"ਵਾਇਸ ਚੇਂਜਰ ਪ੍ਰੋ", voices:"ਆਵਾਜ਼ਾਂ", advanced:"ਐਡਵਾਂਸਡ", pitch:"ਪਿੱਚ", formant:"ਟੋਨ", speed:"ਗਤੀ",
      tapStart:"ਸ਼ੁਰੂ ਕਰਨ ਲਈ ਮਾਈਕ ਦਬਾਓ", listening:"ਸੁਣ ਰਿਹਾ ਹੈ…", stopped:"ਰੁਕਿਆ ਹੋਇਆ", hint:"ਲਾਈਵ — ਕੁਝ ਵੀ ਸੇਵ ਨਹੀਂ ਹੁੰਦਾ",
      install:"ਇਸਨੂੰ ਹੋਮ ਸਕ੍ਰੀਨ ਤੇ ਐਪ ਵਾਂਗ ਇੰਸਟਾਲ ਕਰੋ", installBtn:"ਇੰਸਟਾਲ", save:"ਆਖਰੀ ਟੇਕ ਸੇਵ ਕਰੋ", noMic:"ਮਾਈਕ ਪਹੁੰਚ ਤੋਂ ਇਨਕਾਰ"},
  tr:{brand:"Voice Changer Pro", voices:"Sesler", advanced:"Gelişmiş", pitch:"Perde", formant:"Ton", speed:"Hız",
      tapStart:"Başlamak için mikrofona dokunun", listening:"Dinliyor…", stopped:"Durduruldu", hint:"Canlı — hiçbir şey kaydedilmez",
      install:"Bunu ana ekrana uygulama olarak yükleyin", installBtn:"Yükle", save:"Son kaydı sakla", noMic:"Mikrofon erişimi reddedildi"}
};
const langNames = {en:"English", ur:"اردو", hi:"हिन्दी", ar:"العربية", es:"Español", fr:"Français", zh:"中文", bn:"বাংলা", pa:"ਪੰਜਾਬੀ", tr:"Türkçe"};
let currentLang = "en";
try{ currentLang = localStorage.getItem("vcp_lang") || "en"; }catch(_){}
const langSelect = document.getElementById("langSelect");
Object.keys(langNames).forEach(code=>{
  const opt = document.createElement("option");
  opt.value = code; opt.textContent = langNames[code];
  if(code===currentLang) opt.selected = true;
  langSelect.appendChild(opt);
});
function t(key){ return (translations[currentLang] && translations[currentLang][key]) || translations.en[key]; }
function applyLang(){
  document.querySelector(".brand").innerHTML = `<span class="dot"></span> ${t("brand")}`;
  document.getElementById("voicesLabel").textContent = t("voices");
  document.getElementById("advancedLabel").innerHTML = `${t("advanced")} <span class="chev">▾</span>`;
  document.getElementById("pitchLabel").innerHTML = `${t("pitch")} <span class="val" id="pitchVal">${pitchSlider.value}</span>`;
  document.getElementById("formantLabel").innerHTML = `${t("formant")} <span class="val" id="formantVal">${formantSlider.value}</span>`;
  document.getElementById("speedLabel").innerHTML = `${t("speed")} <span class="val" id="speedVal">${parseFloat(speedSlider.value).toFixed(2)}x</span>`;
  document.getElementById("hintText").textContent = t("hint");
  document.getElementById("installText").textContent = t("install");
  document.getElementById("installBtn").textContent = t("installBtn");
  document.getElementById("saveLabel").textContent = t("save");
  document.getElementById("statusText").textContent = isRecording ? t("listening") : t("tapStart");
  document.documentElement.dir = (currentLang === "ur" || currentLang === "ar") ? "rtl" : "ltr";
}
langSelect.addEventListener("change", e=>{
  currentLang = e.target.value;
  try{ localStorage.setItem("vcp_lang", currentLang); }catch(_){}
  applyLang();
});

/* ---------------- Voice presets (26) ---------------- */
const presets = [
  {name:"Normal", emoji:"🎙️", pitch:0, formant:0, distortion:0, filter:null},
  {name:"Chipmunk", emoji:"🐿️", pitch:9, formant:40, distortion:0, filter:{type:"highpass",freq:300}},
  {name:"Deep Giant", emoji:"🗿", pitch:-9, formant:-50, distortion:0.05, filter:{type:"lowpass",freq:2500}},
  {name:"Robot", emoji:"🤖", pitch:-2, formant:0, distortion:0.15, ring:true},
  {name:"Alien", emoji:"👽", pitch:5, formant:60, distortion:0.1, chorus:true},
  {name:"Demon", emoji:"👹", pitch:-7, formant:-70, distortion:0.25, filter:{type:"lowpass",freq:1800}},
  {name:"Ghost", emoji:"👻", pitch:3, formant:20, reverbWet:0.6, filter:{type:"highpass",freq:500}},
  {name:"Baby", emoji:"👶", pitch:11, formant:55, distortion:0},
  {name:"Old Man", emoji:"🧓", pitch:-4, formant:-25, distortion:0.05},
  {name:"Cartoon", emoji:"🎨", pitch:8, formant:35, chorus:true},
  {name:"Radio", emoji:"📻", pitch:0, formant:0, filter:{type:"bandpass",freq:1200}},
  {name:"Telephone", emoji:"☎️", pitch:0, formant:-10, filter:{type:"bandpass",freq:1600}},
  {name:"Underwater", emoji:"🌊", pitch:-3, formant:0, filter:{type:"lowpass",freq:800}, reverbWet:0.3},
  {name:"Cave Echo", emoji:"🕳️", pitch:-2, formant:-10, reverbWet:0.7},
  {name:"Chorus Angel", emoji:"😇", pitch:4, formant:15, chorus:true, reverbWet:0.35},
  {name:"Darth", emoji:"🖤", pitch:-6, formant:-40, distortion:0.08, filter:{type:"lowpass",freq:3000}},
  {name:"Squeaky Toy", emoji:"🧸", pitch:12, formant:70, distortion:0},
  {name:"Monster Truck", emoji:"🚚", pitch:-10, formant:-60, distortion:0.2},
  {name:"Female Soft", emoji:"👩", pitch:4, formant:30, distortion:0},
  {name:"Male Deep", emoji:"👨", pitch:-4, formant:-30, distortion:0},
  {name:"Vintage Vinyl", emoji:"💿", pitch:-1, formant:-5, distortion:0.05, filter:{type:"bandpass",freq:1000}},
  {name:"Helium", emoji:"🎈", pitch:10, formant:50, distortion:0},
  {name:"Metallic", emoji:"⚙️", pitch:0, formant:0, ring:true, distortion:0.1},
  {name:"Whisper", emoji:"🤫", pitch:1, formant:10, filter:{type:"highpass",freq:800}},
  {name:"Broadcast News", emoji:"📺", pitch:-1, formant:-10, filter:{type:"lowpass",freq:6000}},
  {name:"Dream Fade", emoji:"💫", pitch:2, formant:10, reverbWet:0.5, chorus:true},
];

/* ---------------- Audio engine (Tone.js) ---------------- */
let mic, speedNode, pitchShift, formantFilter, distortion, chorus, reverb, ringMod, analyser, ctxStarted = false;
let isRecording = false;
let activePreset = presets[0];
let recorder, recordedChunks = [], lastBlobUrl = null;
let speedRate = 1.0; // 0.5x - 2x, read live inside the speed node's audio callback

/* Live speed (tape-style) node: reads incoming samples into a small ring buffer
   and plays them back at speedRate using linear interpolation. Faster than 1x
   pulls the pitch up naturally (like a sped-up tape); the Pitch slider can be
   used afterwards to compensate if you want speed changed but pitch kept flat. */
function buildSpeedNode(){
  const raw = (Tone.getContext ? Tone.getContext().rawContext : Tone.context.rawContext) || Tone.context._context || Tone.context;
  const node = raw.createScriptProcessor(2048, 1, 1);
  let ring = new Float32Array(0);
  let readPos = 0;
  const maxRingSeconds = 1.0; // cap so latency can't grow unbounded

  node.onaudioprocess = (e) => {
    const input = e.inputBuffer.getChannelData(0);
    const merged = new Float32Array(ring.length + input.length);
    merged.set(ring);
    merged.set(input, ring.length);
    ring = merged;

    const output = e.outputBuffer.getChannelData(0);
    for (let i = 0; i < output.length; i++) {
      const i0 = Math.floor(readPos);
      const frac = readPos - i0;
      if (i0 + 1 < ring.length) {
        output[i] = ring[i0] * (1 - frac) + ring[i0 + 1] * frac;
      } else {
        output[i] = 0;
      }
      readPos += speedRate;
    }
    const consumed = Math.floor(readPos);
    if (consumed > 0) {
      ring = ring.slice(consumed);
      readPos -= consumed;
    }
    const maxLen = raw.sampleRate * maxRingSeconds;
    if (ring.length > maxLen) {
      ring = ring.slice(ring.length - maxLen);
      readPos = Math.min(readPos, ring.length);
    }
  };
  return node;
}

function buildChain(){
  mic = new Tone.UserMedia();
  speedNode = buildSpeedNode();
  pitchShift = new Tone.PitchShift({pitch:0, windowSize:0.06, delayTime:0});
  formantFilter = new Tone.Filter({type:"peaking", frequency:1200, Q:0.9, gain:0});
  distortion = new Tone.Distortion({distortion:0, wet:0});
  chorus = new Tone.Chorus({frequency:1.5, delayTime:3.5, depth:0.6, wet:0}).start();
  reverb = new Tone.Reverb({decay:2.2, wet:0});
  ringMod = new Tone.FrequencyShifter({frequency:0});
  analyser = new Tone.Analyser("waveform", 128);

  Tone.connect(mic, speedNode);
  Tone.connect(speedNode, pitchShift);
  pitchShift.chain(formantFilter, distortion, ringMod, chorus, reverb, analyser, Tone.Destination);
}

function applyPreset(p){
  activePreset = p;
  document.getElementById("presetName").textContent = p.name;
  pitchSlider.value = p.pitch;
  formantSlider.value = p.formant;
  document.getElementById("pitchVal").textContent = p.pitch;
  document.getElementById("formantVal").textContent = p.formant;

  pitchShift.pitch = p.pitch;
  formantFilter.gain.value = p.formant;
  distortion.distortion = p.distortion || 0;
  distortion.wet.value = p.distortion ? 1 : 0;
  chorus.wet.value = p.chorus ? 0.5 : 0;
  reverb.wet.value = p.reverbWet || 0;
  ringMod.frequency.value = p.ring ? 30 : 0;

  if(p.filter){
    formantFilter.type = p.filter.type;
    formantFilter.frequency.value = p.filter.freq;
    formantFilter.Q.value = 1;
  } else {
    formantFilter.type = "peaking";
    formantFilter.frequency.value = 1200;
  }

  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active", c.dataset.name === p.name));
}

async function toggleMic(){
  document.getElementById("statusText").textContent = "Button tapped, starting…";
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    document.getElementById("statusText").textContent = "Error: mic API not available in this browser";
    return;
  }
  if(!ctxStarted){
    try{
      await Tone.start();
      buildChain();
      ctxStarted = true;
      applyPreset(pendingPreset || presets[0]);
    }catch(err){
      document.getElementById("statusText").textContent = "Error: " + (err && err.message ? err.message : err);
      console.error(err);
      return;
    }
  }
  const btn = document.getElementById("micBtn");
  if(!isRecording){
    try{
      await mic.open();
      isRecording = true;
      btn.classList.add("recording");
      document.getElementById("statusText").textContent = t("listening");
      startOrbLoop();
    }catch(err){
      document.getElementById("statusText").textContent = t("noMic");
    }
  } else {
    mic.close();
    isRecording = false;
    btn.classList.remove("recording");
    document.getElementById("statusText").textContent = t("stopped");
  }
}
document.getElementById("micBtn").addEventListener("click", toggleMic);

/* ---------------- Preset chips ---------------- */
const scroll = document.getElementById("presetScroll");
presets.forEach(p=>{
  const chip = document.createElement("div");
  chip.className = "chip" + (p.name==="Normal" ? " active" : "");
  chip.dataset.name = p.name;
  chip.innerHTML = `<div class="emoji">${p.emoji}</div><div class="label">${p.name}</div>`;
  chip.addEventListener("click", ()=>{
    pendingPreset = p;
    document.getElementById("presetName").textContent = p.name;
    document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active", c.dataset.name === p.name));
    if(ctxStarted) applyPreset(p);
  });
  scroll.appendChild(chip);
});
let pendingPreset = null;

/* ---------------- Manual sliders ---------------- */
const pitchSlider = document.getElementById("pitchSlider");
const formantSlider = document.getElementById("formantSlider");
pitchSlider.addEventListener("input", ()=>{
  document.getElementById("pitchVal").textContent = pitchSlider.value;

formantSlider.addEventListener("input", ()=>{

/* ---------------- Orb visualizer (signature element) ---------------- */
const canvas = document.getElementById("orb");
const gctx = canvas.getContext("2d");
function startOrbLoop(){
  function draw(){
    requestAnimationFrame(draw);
    const w = canvas.width, h = canvas.height, cx = w/2, cy = h/2;
    gctx.clearRect(0,0,w,h);
    let level = 0;
    if(analyser){
      const data = analyser.getValue();
      let sum = 0;
      for(let i=0;i<data.length;i++) sum += Math.abs(data[i]);
      level = Math.min(1, (sum/data.length) * 6);
    }
    const baseR = 46;
    const r = baseR + level * 55;
    const grad = gctx.createRadialGradient(cx,cy,10,cx,cy,r+30);
    grad.addColorStop(0, "rgba(124,92,255,0.9)");
    grad.addColorStop(0.5, "rgba(35,229,201,0.35)");
    grad.addColorStop(1, "rgba(35,229,201,0)");
    gctx.beginPath();
    gctx.arc(cx,cy,r,0,Math.PI*2);
    gctx.fillStyle = grad;
    gctx.fill();

    gctx.beginPath();
    gctx.arc(cx,cy,baseR*0.55,0,Math.PI*2);
    gctx.fillStyle = isRecording ? "#EDEFF5" : "#3A3F4E";
    gctx.fill();
  }
  draw();
}
(function idleOrb(){
  requestAnimationFrame(idleOrb);
  const w = canvas.width, h = canvas.height, cx=w/2, cy=h/2;
  if(!isRecording){
    gctx.clearRect(0,0,w,h);
    const grad = gctx.createRadialGradient(cx,cy,10,cx,cy,76);
    grad.addColorStop(0, "rgba(124,92,255,0.35)");
    grad.addColorStop(1, "rgba(35,229,201,0)");
    gctx.beginPath(); gctx.arc(cx,cy,46,0,Math.PI*2); gctx.fillStyle = grad; gctx.fill();
    gctx.beginPath(); gctx.arc(cx,cy,25,0,Math.PI*2); gctx.fillStyle = "#3A3F4E"; gctx.fill();
  }
})();

/* ---------------- Optional save last take ---------------- */
const saveBtn = document.getElementById("saveBtn");
async function setupRecorder(){
  try{
    const raw = (Tone.getContext ? Tone.getContext().rawContext : Tone.context.rawContext) || Tone.context._context || Tone.context;
    const dest = raw.createMediaStreamDestination();
    analyser.connect ? null : null;
    reverb.connect(dest);
    recorder = new MediaRecorder(dest.stream);
    recorder.ondataavailable = e => { if(e.data.size>0) recordedChunks.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(recordedChunks, {type:"audio/webm"});
      recordedChunks = [];
      if(lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
      lastBlobUrl = URL.createObjectURL(blob);
      saveBtn.disabled = false;
    };
  }catch(_){}
}
document.getElementById("micBtn").addEventListener("click", async ()=>{
  if(!recorder && ctxStarted) await setupRecorder();
  if(isRecording && recorder && recorder.state !== "recording"){ recordedChunks=[]; recorder.start(); }
  else if(!isRecording && recorder && recorder.state === "recording"){ recorder.stop(); }
});
saveBtn.addEventListener("click", ()=>{
  if(!lastBlobUrl) return;
  const a = document.createElement("a");
  a.href = lastBlobUrl;
  a.download = "voice-changer-pro-take.webm";
  document.body.appendChild(a); a.click(); a.remove();
});

/* ---------------- PWA install prompt ---------------- */
let deferredPrompt;
window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBanner").style.display = "flex";
});
document.getElementById("installBtn").addEventListener("click", async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById("installBanner").style.display = "none";
});
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

applyLang();
